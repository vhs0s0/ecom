version: "3.8"

services:
  mysql:
    image: mysql:latest
    container_name: mysql-ecom-container
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3306:3306"
    volumes:
      - mysql-ecom-data:/var/lib/mysql

volumes:
  mysql-ecom-data:
